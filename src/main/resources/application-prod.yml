server:
  port: 9001


spring:
  application:
    name: sms-stock-service


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DRIVER_CLASS_NAME}


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}


  data:
    redis:
      host: redis
      port: 6379



management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always